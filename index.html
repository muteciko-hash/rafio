<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KRAVTS // CYBER-VFD MODULE 1.2</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --vfd-bg: #030605;
  --vfd-on: #39ffca;
  --vfd-glow: rgba(57, 255, 202, 0.55);
  --vfd-dim: #224235;
  --pcb-green: #143826;
  --pcb-edge: #0c2418;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body, html {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: 'VT323', monospace;
  user-select: none;
  -webkit-user-select: none;
}

/* YEŞİL DEVRE KARTI (PCB) DIŞ KASASI - GÖNDERDİĞİN FOTOĞRAFIN BİREBİR ORTAMI */
.pcb-board {
  width: 96vw;
  height: 54vw;
  max-width: 1400px;
  max-height: 787px;
  background-color: var(--pcb-green);
  background-image: linear-gradient(135deg, #1b4d34 0%, #0d291b 100%);
  border: 0.8vw solid var(--pcb-edge);
  border-radius: 6px;
  box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 15px rgba(0,0,0,0.6);
  padding: 1.2vw 1.8vw;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
}

/* PCB KÖŞE VİDALARI */
.screw {
  position: absolute;
  width: 1.2vw; height: 1.2vw;
  background: radial-gradient(circle, #ccc 30%, #555 70%, #111 100%);
  border-radius: 50%;
  box-shadow: inset 0 0 2px #000;
}
.screw-tl { top: 0.6vw; left: 0.6vw; }
.screw-tr { top: 0.6vw; right: 0.6vw; }
.screw-bl { bottom: 0.6vw; left: 0.6vw; }
.screw-br { bottom: 0.6vw; right: 0.6vw; }

/* PCB ÜSTÜNDEKİ YAZILAR VE ETİKETLER */
.pcb-header {
  display: flex;
  justify-content: space-between;
  font-size: 1.1vw;
  color: #3b7a57;
  letter-spacing: 1.5px;
  padding: 0 0.5vw;
  text-transform: uppercase;
}

/* VFD CAM EKRAN ÇERÇEVESİ (KOYU GÜMÜŞ/SİYAH METAL ÇERÇEVE) */
.vfd-glass-panel {
  flex: 1;
  background-color: var(--vfd-bg);
  background-image: 
    linear-gradient(90deg, rgba(255,140,60,0.03) 1px, transparent 1px),
    linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(2,5,4,0.95) 100%);
  background-size: 3vw 100%, 100% 100%;
  border: 0.5vw solid #1b2621;
  box-shadow: inset 0 0 25px #000;
  padding: 1vw 1.5vw;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  margin: 0.6vw 0;
}

/* VFD CAM TARAMA VE FLAMAN ÇİZGİLERİ */
.vfd-glass-panel::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.2), rgba(0,0,0,0.2) 1px, transparent 1px, transparent 3px);
  pointer-events: none;
  z-index: 10;
}

/* ÜST BİLGİ SATIRI */
.vfd-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 2;
}
.vfd-main-title {
  font-size: 2.8vw;
  color: var(--vfd-on);
  text-shadow: 0 0 8px var(--vfd-glow);
  letter-spacing: 2px;
}
.vfd-sub-info {
  font-size: 1.2vw;
  color: var(--vfd-dim);
  letter-spacing: 2px;
}
.vfd-sub-info span.active {
  color: var(--vfd-on);
  text-shadow: 0 0 5px var(--vfd-glow);
}

/* 20 KANAL IZGARASI (GÖNDERDİĞİN GÖRSELDEKİ SÖNÜK 16-SEGMENT KUTULAR) */
.vfd-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 0.6vw 0.8vw;
  z-index: 2;
  margin: 0.5vw 0;
}

.ch-cell {
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(18, 56, 44, 0.4);
  color: var(--vfd-dim);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: inherit;
  padding: 0.3vw 0.2vw;
  border-radius: 1px;
  position: relative;
  transition: all 0.1s ease;
}

/* Sönük 16-segment arka plan deseni (Görseldeki o çapraz çizgili kutucuklar) */
.ch-cell::before {
  content: "ZZZ";
  position: absolute;
  font-size: 1.4vw;
  color: rgba(18, 56, 44, 0.22);
  letter-spacing: 1px;
  pointer-events: none;
  z-index: 1;
}

.ch-cell span {
  position: relative;
  z-index: 2;
  line-height: 1.1;
}

.ch-cell .c-num { font-size: 1.3vw; }
.ch-cell .c-name { font-size: 1.3vw; font-weight: bold; }

/* AKTİF KANAL PARILTISI */
.ch-cell.active {
  border-color: var(--vfd-on);
  color: var(--vfd-on);
  background: rgba(57, 255, 202, 0.08);
  text-shadow: 0 0 10px var(--vfd-glow);
  box-shadow: inset 0 0 8px rgba(57, 255, 202, 0.3);
}
.ch-cell.active::before { display: none; }

/* ALT KONTROL VE KAYAN YAZI */
.vfd-bottom {
  display: flex;
  flex-direction: column;
  gap: 0.4vw;
  z-index: 2;
}

.ctrl-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.btn-group {
  display: flex;
  gap: 1vw;
}

.vfd-btn {
  background: rgba(0,0,0,0.5);
  border: 1px solid var(--vfd-dim);
  color: var(--vfd-dim);
  font-family: inherit;
  font-size: 1.3vw;
  padding: 0.1vw 0.8vw;
  cursor: pointer;
  border-radius: 1px;
  transition: all 0.1s ease;
}
.vfd-btn.active, .vfd-btn:hover {
  border-color: var(--vfd-on);
  color: var(--vfd-on);
  text-shadow: 0 0 6px var(--vfd-glow);
  background: rgba(57, 255, 202, 0.1);
}

/* MARQUEE KAYAN YAZI */
.ticker-box {
  border-top: 1px dashed var(--vfd-dim);
  padding-top: 0.3vw;
  overflow: hidden;
  white-space: nowrap;
  display: flex;
}
.ticker-text {
  display: inline-block;
  font-size: 1.5vw;
  color: var(--vfd-on);
  text-shadow: 0 0 8px var(--vfd-glow);
  letter-spacing: 2px;
  animation: scrollText 25s linear infinite;
}
@keyframes scrollText {
  0% { transform: translateX(100%); }
  100% { transform: translateX(-100%); }
}
</style>
</head>
<body>

<div class="pcb-board">
  <div class="screw screw-tl"></div>
  <div class="screw screw-tr"></div>
  <div class="screw screw-bl"></div>
  <div class="screw screw-br"></div>

  <div class="pcb-header">
    <span>KRAVTS // CYBER-VFD</span>
    <span>REV 1.2</span>
  </div>

  <div class="vfd-glass-panel">
    <!-- ÜST BİLGİ -->
    <div class="vfd-top">
      <div class="vfd-main-title" id="lbl-date">TUE NOV 17</div>
      <div class="vfd-sub-info"><span class="active">FM ST</span> PRESET <span id="lbl-preset">1</span></div>
      <div class="vfd-main-title" id="lbl-time">12:57:02</div>
    </div>

    <!-- ORTA 20'Lİ KANAL IZGARASI -->
    <div class="vfd-grid" id="radioGrid"></div>

    <!-- ALT KONTROLLER VE KANALLAR -->
    <div class="vfd-bottom">
      <div class="ctrl-bar">
        <div class="btn-group">
          <button class="vfd-btn" onclick="prevStation()">[&lt; PREV]</button>
          <button class="vfd-btn active" id="btn-play" onclick="playAudio()">[PLAY]</button>
          <button class="vfd-btn" id="btn-stop" onclick="stopAudio()">[STOP]</button>
          <button class="vfd-btn" onclick="nextStation()">[NEXT &gt;]</button>
        </div>
        <div style="font-size: 1.1vw; color: var(--vfd-dim); letter-spacing: 1px;">KRAVTS RAD.430</div>
      </div>
      <div class="ticker-box">
        <div class="ticker-text" id="lbl-status">«« NOW PLAYING: 01 NIGHTRIDE FM Stereo Stream Online ««</div>
      </div>
    </div>
  </div>

  <div class="pcb-header" style="justify-content: flex-end; font-size: 0.9vw;">
    <span style="color: #1b4d34;">###-CABLE-BUS-###</span>
  </div>
</div>

<audio id="audioPlayer" preload="none"></audio>

<script>
const stations = [
  { num: "01", name: "NIGHT", url: "https://stream.nightride.fm/nightride.mp3", desc: "NIGHTRIDE FM - Synthwave & Darksynth" },
  { num: "02", name: "DARK", url: "https://stream.nightride.fm/darksynth.mp3", desc: "DARKSYNTH - Cyberpunk & Dark Electro" },
  { num: "03", name: "CHILL", url: "https://stream.nightride.fm/chillsynth.mp3", desc: "CHILLSYNTH - Relaxing Retrowave" },
  { num: "04", name: "DATA", url: "https://stream.nightride.fm/datawave.mp3", desc: "DATAWAVE - Ambient & Cyber Beats" },
  { num: "05", name: "HORROR", url: "https://stream.nightride.fm/horrorsynth.mp3", desc: "HORRORSYNTH - Dark Cinematic Soundtracks" },
  { num: "06", name: "SPACE", url: "https://stream.nightride.fm/spacesynth.mp3", desc: "SPACESYNTH - Cosmic Electronic Voyage" },
  { num: "07", name: "DEFCON", url: "https://ice2.somafm.com/defcon-128-mp3", desc: "SOMA FM DEFCON - Hacker & Electronic Music" },
  { num: "08", name: "SPACEST", url: "https://ice2.somafm.com/spacestation-128-mp3", desc: "SOMA FM SPACESTATION - Ambient & Space" },
  { num: "09", name: "DARKZN", url: "https://ice2.somafm.com/darkzone-128-mp3", desc: "SOMA FM DARK ZONE - Industrial & Ambient" },
  { num: "10", name: "PLAZA", url: "https://radio.plaza.one/mp3", desc: "PLAZA.ONE - 80s Vapourwave & Synth" },
  { num: "11", name: "BOOT", url: "https://ice2.somafm.com/bootliquor-128-mp3", desc: "SOMA FM BOOT LIQUOR - Americana & Country" },
  { num: "12", name: "REAL", url: "https://listen.181fm.com/181-realcountry_128k.mp3", desc: "181.FM REAL COUNTRY - Classic Country Hits" },
  { num: "13", name: "HWY181", url: "https://listen.181fm.com/181-highway_128k.mp3", desc: "181.FM HIGHWAY 181 - Trucker Country" },
  { num: "14", name: "80SCTY", url: "https://listen.181fm.com/181-80scountry_128k.mp3", desc: "181.FM 80S COUNTRY - Retro Country Gold" },
  { num: "15", name: "FRNTPCH", url: "https://listen.181fm.com/181-frontporch_128k.mp3", desc: "181.FM FRONT PORCH - Acoustic & Country" },
  { num: "16", name: "GROOVE", url: "https://ice2.somafm.com/groovesalad-128-mp3", desc: "SOMA FM GROOVE SALAD - Downtambient" },
  { num: "17", name: "SECAGT", url: "https://ice2.somafm.com/secretagent-128-mp3", desc: "SOMA FM SECRET AGENT - Spy & Lounge Beats" },
  { num: "18", name: "DRONE", url: "https://ice2.somafm.com/dronezone-128-mp3", desc: "SOMA FM DRONE ZONE - Atmospheric Ambient" },
  { num: "19", name: "EAGLE", url: "https://listen.181fm.com/181-eagle_128k.mp3", desc: "181.FM THE EAGLE - Classic Rock & Night" },
  { num: "20", name: "YACHT", url: "https://listen.181fm.com/181-yachtrock_128k.mp3", desc: "181.FM YACHT ROCK - Smooth 70s & 80s" }
];

const ap = document.getElementById("audioPlayer");
let activeIndex = 0;

const grid = document.getElementById("radioGrid");
stations.forEach((st, idx) => {
  const btn = document.createElement("button");
  btn.className = `ch-cell ${idx === 0 ? 'active' : ''}`;
  btn.onclick = () => selectStation(idx);
  btn.innerHTML = `<span class="c-num">${st.num}</span><span class="c-name">${st.name}</span>`;
  grid.appendChild(btn);
});

function selectStation(idx) {
  document.querySelectorAll(".ch-cell").forEach((b, i) => {
    b.classList.toggle("active", i === idx);
  });
  activeIndex = idx;
  const s = stations[idx];
  document.getElementById("lbl-preset").innerText = s.num;
  ap.pause();
  ap.src = s.url;
  playAudio();
}

function nextStation() {
  let nextIdx = (activeIndex + 1) % stations.length;
  selectStation(nextIdx);
}

function prevStation() {
  let prevIdx = (activeIndex - 1 + stations.length) % stations.length;
  selectStation(prevIdx);
}

function playAudio() {
  const s = stations[activeIndex];
  document.getElementById("lbl-status").innerText = `«« CONNECTING: ${s.desc} ... ««`;
  document.getElementById("btn-play").classList.add("active");
  document.getElementById("btn-stop").classList.remove("active");
  ap.play()
    .then(() => {
      document.getElementById("lbl-status").innerText = `«« NOW PLAYING: ${s.num} - ${s.desc} // STEREO STREAM ONLINE ««`;
    })
    .catch(() => {
      document.getElementById("lbl-status").innerText = `«« STREAM READY / PAUSED: ${s.num} ${s.name} ««`;
    });
}

function stopAudio() {
  ap.pause();
  document.getElementById("btn-play").classList.remove("active");
  document.getElementById("btn-stop").classList.add("active");
  const s = stations[activeIndex];
  document.getElementById("lbl-status").innerText = `«« STOPPED: ${s.num} ${s.name} ««`;
}

function updateClock() {
  const now = new Date();
  const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  document.getElementById("lbl-date").innerText = `${days[now.getDay()]} ${months[now.getMonth()]} ${String(now.getDate()).padStart(2, "0")}`;
  
  const h = String(now.getHours()).padStart(2, "0");
  const m = String(now.getMinutes()).padStart(2, "0");
  const s = String(now.getSeconds()).padStart(2, "0");
  document.getElementById("lbl-time").innerText = `${h}:${m}:${s}`;
}
setInterval(updateClock, 1000);
updateClock();

ap.src = stations[0].url;
</script>
</body>
</html>
